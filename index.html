<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171923">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Акценты">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Генератор акцентов для барабанщиков</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #11131b; color: #f5f5f7; }
    main { width: min(100% - 32px, 720px); margin: 0 auto; padding: 40px 0 72px; }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
    .intro, .hint { color: #b8bbc9; line-height: 1.5; }
    .intro { margin: 0 0 32px; }
    form { display: grid; gap: 18px; padding: 24px; border: 1px solid #343746; border-radius: 20px; background: #1b1e29; }
    label { display: grid; gap: 7px; font-weight: 650; }
    input { width: 100%; min-height: 52px; padding: 10px 14px; border: 1px solid #565b70; border-radius: 10px; outline: none; background: #11131b; color: #fff; font: inherit; font-size: 1.2rem; }
    input:focus-visible, button:focus-visible { outline: 3px solid #ffcb61; outline-offset: 2px; }
    .hint { margin: 0; font-size: .9rem; font-weight: 400; }
    button { min-height: 54px; padding: 12px 20px; border: 0; border-radius: 10px; background: #ffca59; color: #171923; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #ffda83; }
    .output-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 34px 0 14px; }
    h2 { margin: 0; font-size: 1.4rem; }
    #copy { min-height: 40px; padding: 8px 12px; background: #303548; color: #fff; font-size: .9rem; }
    #copy:hover { background: #414861; }
    #copy[hidden] { display: none; }
    #result { display: grid; grid-template-columns: repeat(4, minmax(max-content, 1fr)); gap: 6px; margin: 0; padding: 0; overflow-x: auto; list-style: none; }
    #result li { padding: 12px 6px; border: 1px solid #343746; border-radius: 12px; background: #1b1e29; font-size: clamp(.8rem, 2.8vw, 1.35rem); font-weight: 650; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #status { min-height: 1.5em; color: #b8bbc9; }
    @media (max-width: 480px) { main { padding-top: 28px; } form { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <h1>Генератор акцентов</h1>
    <p class="intro">Случайные позиции акцентов для отработки техники рук. Каждое число показывает, на какую ноту доли приходится акцент.</p>

    <form id="generator">
      <label for="beats">Долей в такте
        <input id="beats" name="beats" type="number" inputmode="numeric" min="1" max="64" step="1" value="4" required>
      </label>
      <label for="notes">Нот в доле
        <input id="notes" name="notes" type="number" inputmode="numeric" min="1" max="64" step="1" value="3" required>
        <span class="hint">Числа в такте будут от 1 до этого значения включительно.</span>
      </label>
      <label for="bars">Число тактов
        <input id="bars" name="bars" type="number" inputmode="numeric" min="1" max="256" step="1" value="2" required>
      </label>
      <button type="submit">Сгенерировать</button>
    </form>

    <div class="output-header">
      <h2>Последовательность</h2>
      <button id="copy" type="button" hidden>Скопировать</button>
    </div>
    <ol id="result" aria-live="polite"></ol>
    <p id="status" role="status"></p>
    <p id="offline-status" class="hint" hidden>Готово к работе без интернета.</p>
  </main>

  <script>
    const form = document.querySelector('#generator');
    const result = document.querySelector('#result');
    const copyButton = document.querySelector('#copy');
    const status = document.querySelector('#status');
    let generatedBars = [];

    function randomNumber(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const beats = Number(form.elements.beats.value);
      const notes = Number(form.elements.notes.value);
      const bars = Number(form.elements.bars.value);
      generatedBars = Array.from({ length: bars }, () =>
        `[${Array.from({ length: beats }, () => randomNumber(notes)).join('-')}]`
      );

      result.replaceChildren(...generatedBars.map((bar) => {
        const item = document.createElement('li');
        item.textContent = bar;
        return item;
      }));
      copyButton.hidden = false;
      status.textContent = `Сгенерировано тактов: ${bars}`;
    });

    copyButton.addEventListener('click', async () => {
      try {
        const rows = [];
        for (let i = 0; i < generatedBars.length; i += 4) {
          rows.push(generatedBars.slice(i, i + 4).join(' '));
        }
        await navigator.clipboard.writeText(rows.join('\n'));
        status.textContent = 'Последовательность скопирована';
      } catch {
        status.textContent = 'Не удалось скопировать. Выделите последовательность вручную.';
      }
    });

    form.requestSubmit();

    if ('serviceWorker' in navigator && ['https:', 'http:'].includes(location.protocol)) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => navigator.serviceWorker.ready)
        .then(() => { document.querySelector('#offline-status').hidden = false; })
        .catch(() => { /* Генератор работает и без офлайн-кэша. */ });
    }
  </script>
</body>
</html>
